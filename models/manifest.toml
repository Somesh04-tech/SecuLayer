#
# License: Llama 4 Community License. Using it requires the "Built with Llama" credit,
# shown on the Sources page.
#
# Hosts: huggingface.co answers small files with a relative redirect on huggingface.co
# itself and LFS files (model.quant.onnx) with a redirect to Hugging Face's CDN under
# *.hf.co (observed 2026-10-23: us.aws.cdn.hf.co). Any other host is refused.

[model]
name = "prompt-guard-2-22m"
